name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost 2>/dev/null || true
          df -h /

      - name: Install base dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget python3

      - name: Patch legacy manifest for AGP 8
        run: |
          sed -i 's/ package="[^"]*"//' AndroidManifest.xml
          sed -i 's/ android:debuggable="[^"]*"//' AndroidManifest.xml

      - name: Clone engine, patch source, build native libs (armv7a)
        run: |
          git clone --depth 1 --recursive https://github.com/nillerusr/source-engine.git
          cd source-engine
          python3 - <<'PY'
          import sys

          def replace_all(path, old, new, label):
              data = open(path, "rb").read()
              if new in data and old not in data:
                  print("  已经打过补丁，跳过: %s" % path)
                  return
              n = data.count(old)
              if n == 0:
                  sys.exit("!! 找不到锚点 %r in %s" % (old[:40], path))
              open(path, "wb").write(data.replace(old, new))
              print("  %s：替换 %d 处 → %s" % (label, n, path))

          def insert_after_first(path, anchor, ins, mark, label):
              data = open(path, "rb").read()
              if mark in data:
                  print("  已经打过补丁，跳过: %s" % path)
                  return
              i = data.find(anchor)
              if i < 0:
                  sys.exit("!! 找不到锚点 %r in %s" % (anchor[:40], path))
              open(path, "wb").write(data[:i + len(anchor)] + ins + data[i + len(anchor):])
              print("  %s：已插入 → %s" % (label, path))

          # ① 字体路径补丁
          # 安卓分支把字体目录写死成 <APP_DATA_PATH>/files/ = /data/user/0/<包名>/files/
          # （应用私有目录，外部无法写入 → 546 次 "Failed to load custom font file ..."）
          # 改成 <VALVE_GAME_PATH>/files/，由壳设为 /storage/emulated/0/srceng/（用户可写）。
          replace_all("vgui2/vgui_surfacelib/linuxfont.cpp",
                      b'getenv("APP_DATA_PATH")', b'getenv("VALVE_GAME_PATH")',
                      "字体路径")

          # ② 主菜单"永久 loading / 背景淡出成黑屏"补丁 + ③ 构建标记
          # gameui/BasePanel.cpp 的 DrawBackgroundImage()：
          #   if ( m_bRenderingBackgroundTransition ) { alpha = ...255→0; }
          #   if ( IsPC() && ( m_bRenderingBackgroundTransition || state == BACKGROUND_LOADING ) )
          #        → 屏幕右下角画 console/startup_loading（转圈 loading 图）
          # m_bRenderingBackgroundTransition 只在"下一次状态切换"时被清掉，而主菜单停在这个
          # 状态不再切换 → ①3 秒后背景图 alpha 变负被 clamp 成 0，整屏变黑；②loading 图标永久常驻。
          # 修法：转场时间一到就清标志并把背景 alpha 固定回 255。
          # 追加的 static 标记会往日志写一行 [AI-PATCH-v3]，用于确认手机上跑的是打过补丁的版本。
          # 注意：锚点只用"不含换行的子串"，不要写 \r\n —— 仓库源文件是 LF，本地 Windows 上
          # 另存会变成 CRLF，导致本地测试通过、CI 上匹配失败（已经踩过一次）。
          insert_after_first(
              "gameui/BasePanel.cpp",
              b'alpha = clamp( alpha, 0, 255 );',
              b' if ( m_bRenderingBackgroundTransition && frametime >= m_flTransitionEndTime ) { m_bRenderingBackgroundTransition = false; alpha = 255; }\n'
              b'\t\tstatic bool s_bAIReported = false; if ( !s_bAIReported ) { s_bAIReported = true; Msg( "[AI-PATCH-v3] engine patches ACTIVE\\n" ); }',
              b'm_bRenderingBackgroundTransition = false; alpha = 255;',
              "菜单转场+构建标记")
          PY
          echo "=== 补丁校验 ==="
          grep -c 'getenv("VALVE_GAME_PATH")' vgui2/vgui_surfacelib/linuxfont.cpp
          grep -q 'm_bRenderingBackgroundTransition = false; alpha = 255;' gameui/BasePanel.cpp || (echo "!! 转场补丁未生效" && exit 1)
          grep -q 'AI-PATCH-v3' gameui/BasePanel.cpp || (echo "!! 构建标记未插入" && exit 1)
          echo "补丁校验通过"
          wget -q https://dl.google.com/android/repository/android-ndk-r10e-linux-x86_64.zip
          unzip -q android-ndk-r10e-linux-x86_64.zip
          export ANDROID_NDK_HOME=$PWD/android-ndk-r10e/
          export NDK_HOME=$PWD/android-ndk-r10e/
          # ── 改用 release 构建（关键）──────────────────────────────────────────
          # 之前一直用 -T debug：引擎以 -O0 编译，无优化。手机上跑 2408x1080 的 Source
          # 引擎会慢到几秒一帧 → 画面像卡住、loading 图标常亮。
          # 官方发行脚本 nillerusr/just-old-shit/deploy.sh 用的就是 -T release。
          ./waf configure -T release --android=armeabi-v7a-hard,4.9,21 --togles --disable-warns
          ./waf build

      - name: Collect native libs
        run: |
          mkdir -p libs/armeabi-v7a
          find source-engine/build -name "*.so" -exec cp -v {} libs/armeabi-v7a/ \; || true
          find source-engine/lib/android/arm -name "*.so" -exec cp -v {} libs/armeabi-v7a/ \; || true
          ls -la libs/armeabi-v7a/ | head -40

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (manual install into $HOME)
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d android-sdk/
          mv android-sdk/cmdline-tools android-sdk/cmdline-tools-tmp
          mkdir -p android-sdk/cmdline-tools/latest
          mv android-sdk/cmdline-tools-tmp/bin android-sdk/cmdline-tools-tmp/lib android-sdk/cmdline-tools-tmp/NOTICE.txt android-sdk/cmdline-tools-tmp/source.properties android-sdk/cmdline-tools/latest/
          yes | android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk --licenses > /dev/null 2>&1 || true
          android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: srceng-debug-apk
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 验证 APK 内容：壳自带的 extras_dir.vpk 是引擎挂载"自定义菜单资产"（社交图标、字体）用的，
      # 少了它引擎日志会报 Missing Vgui material vgui/discord_logo 等。这里打印出来，避免盲修。
      - name: Inspect APK contents (assets / native libs)
        run: |
          APK=$(ls build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          echo "--- assets/ ---"
          unzip -l "$APK" | grep -E "assets/" || echo "!! 没有任何 assets 文件"
          echo "--- extras_dir.vpk 是否存在 ---"
          unzip -l "$APK" | grep -i "extras_dir.vpk" || echo "!! extras_dir.vpk 不在 APK 里（引擎会缺字体和自定义菜单图标）"
          echo "--- 原生库数量与体积 ---"
          unzip -l "$APK" | grep -c "lib/armeabi-v7a/" || true
          unzip -l "$APK" | grep -E "libSDL2|libengine|libclient|liblauncher" || true
