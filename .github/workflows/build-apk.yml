name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost 2>/dev/null || true
          df -h /

      - name: Install base dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget python3

      - name: Patch legacy manifest for AGP 8
        run: |
          sed -i 's/ package="[^"]*"//' AndroidManifest.xml
          sed -i 's/ android:debuggable="[^"]*"//' AndroidManifest.xml

      - name: Clone engine, patch source, build native libs (armv7a)
        run: |
          git clone --depth 1 --recursive https://github.com/nillerusr/source-engine.git
          cd source-engine
          python3 - <<'PY'
          import sys, os

          def replace_all(path, old, new, label):
              data = open(path, "rb").read()
              if new in data and old not in data:
                  print("  already patched, skip: %s" % path)
                  return
              n = data.count(old)
              if n == 0:
                  sys.exit("!! anchor not found %r in %s" % (old[:60], path))
              open(path, "wb").write(data.replace(old, new))
              print("  %s: replaced %d -> %s" % (label, n, path))

          def insert_after_first(path, anchor, ins, mark, label):
              data = open(path, "rb").read()
              if mark in data:
                  print("  already patched, skip: %s" % path)
                  return
              i = data.find(anchor)
              if i < 0:
                  sys.exit("!! anchor not found %r in %s" % (anchor[:60], path))
              open(path, "wb").write(data[:i + len(anchor)] + ins + data[i + len(anchor):])
              print("  %s: inserted -> %s" % (label, path))

          def insert_before_first(path, anchor, ins, mark, label):
              data = open(path, "rb").read()
              if mark in data:
                  print("  already patched, skip: %s" % path)
                  return
              i = data.find(anchor)
              if i < 0:
                  sys.exit("!! anchor not found %r in %s" % (anchor[:60], path))
              open(path, "wb").write(data[:i] + ins + data[i:])
              print("  %s: inserted -> %s" % (label, path))

          FONT = "vgui2/vgui_surfacelib/linuxfont.cpp"
          PANEL = "gameui/BasePanel.cpp"

          # ============================================================
          # 1) Linux font path: <APP_DATA_PATH>/files/ -> <VALVE_GAME_PATH>/files/
          # ============================================================
          replace_all(FONT, b'getenv("APP_DATA_PATH")', b'getenv("VALVE_GAME_PATH")', "font path")

          # ============================================================
          # 2) Diagnostic helper in linuxfont.cpp (MUST be before line ~215,
          #    i.e. before CLinuxFont::CreateFromMemory, otherwise it is used
          #    before being declared -> compile error)
          # ============================================================
          insert_after_first(
              FONT,
              b'#include "tier0/memdbgon.h"\n',
              b'''
          #include <stdarg.h>
          #include <stdlib.h>
          // [AI-PATCH] font diagnostics: direct file write + fflush (survives a hang)
          static void AIFontDiag( const char *pFmt, ... )
          {
          \tstatic char s_szPath[512];
          \tstatic bool s_bInit = false;
          \tif ( !s_bInit )
          \t{
          \t\ts_bInit = true;
          \t\tconst char *pHome = getenv( "VALVE_GAME_PATH" );
          \t\tsnprintf( s_szPath, sizeof( s_szPath ), "%s/ai_diag.txt", pHome ? pHome : "/sdcard/srceng" );
          \t}
          \tFILE *pFile = fopen( s_szPath, "a" );
          \tif ( !pFile )
          \t\treturn;
          \tva_list args;
          \tva_start( args, pFmt );
          \tvfprintf( pFile, pFmt, args );
          \tva_end( args );
          \tfflush( pFile );
          \tfclose( pFile );
          }
          ''',
              b'[AI-PATCH] font diagnostics',
              "font diag helper")

          # ============================================================
          # 3) Trace every font file request (name -> file), and misses
          # ============================================================
          replace_all(FONT,
                      b'\tif( !filename ) return NULL;\n\tMsg("Found font: %s\\n", filename);',
                      b'\tif( !filename ) { AIFontDiag( "[AI-FONT] NOT-FOUND win=\'%s\'\\n", windowsFontName ); return NULL; }\n'
                      b'\tMsg("Found font: %s\\n", filename);\n'
                      b'\tAIFontDiag( "[AI-FONT] request win=\'%s\' file=\'%s\'\\n", windowsFontName, filename );',
                      "font lookup trace")

          # ============================================================
          # 4) Deep trace of font creation + iteration cap on the height
          #    search loop (real-device evidence: the engine hangs while
          #    creating a font, and this loop has no termination guard)
          # ============================================================
          insert_after_first(
              FONT,
              b'bool CLinuxFont::CreateFromMemory(const char *windowsFontName, void *data, int datasize, int tall, int weight, int blur, int scanlines, int flags)\n{\n',
              b'\tAIFontDiag( "[AI-FONT-CREATE] begin name=\'%s\' tall=%d datasize=%d\\n", windowsFontName, tall, datasize );\n',
              b'[AI-FONT-CREATE] begin',
              "font create entry")

          insert_after_first(
              FONT,
              b'\tFT_Error error = FT_New_Memory_Face( FontManager().GetFontLibraryHandle(), (FT_Byte *)data, datasize, 0, &m_face );\n',
              b'\tAIFontDiag( "[AI-FONT-CREATE] FT_New_Memory_Face err=%d\\n", error );\n',
              b'[AI-FONT-CREATE] FT_New_Memory_Face',
              "FT face trace")

          insert_before_first(
              FONT,
              b'\tbool bFirstTimeThrough = true;\n',
              b'\tint nAIIter = 0;\n',
              b'\tint nAIIter = 0;',
              "loop counter")

          insert_after_first(
              FONT,
              b'\tfor ( ;; )\n\t{\n',
              b'\t\tnAIIter++;\n'
              b'\t\tif ( nAIIter > 200 ) { AIFontDiag( "[AI-FONT-LOOP] ABORT after %d iters name=\'%s\' req=%d h=%d tall=%d\\n", nAIIter, windowsFontName, m_iHeightRequested, m_iHeight, m_iTall ); break; }\n',
              b'[AI-FONT-LOOP] ABORT',
              "loop cap")

          insert_after_first(
              FONT,
              b'\tm_iHeight = FIXED6_2INT( fxpHeight );\n',
              b'\t\tif ( nAIIter <= 40 ) AIFontDiag( "[AI-FONT-LOOP] it=%d name=\'%s\' req=%d h=%d inc=%d tall=%d\\n", nAIIter, windowsFontName, m_iHeightRequested, m_iHeight, IncAmount, m_iTall );\n',
              b'[AI-FONT-LOOP] it=',
              "loop iteration trace")

          insert_after_first(
              FONT,
              b'\tm_faceValid = true;\n',
              b'\tAIFontDiag( "[AI-FONT-CREATE] ok name=\'%s\' finalH=%d req=%d iters=%d\\n", windowsFontName, m_iHeight, m_iHeightRequested, nAIIter );\n',
              b'[AI-FONT-CREATE] ok',
              "font create exit")

          # ============================================================
          # 4b) Metric sanity clamp: with unusable font metrics (variable font /
          #     corrupted data) the computed height is absurd (real device: asked
          #     16px, got 1603 / 6502). Accept the requested size and bail out
          #     instead of searching, so we never render a glyph at 7000px.
          # ============================================================
          insert_before_first(
              FONT,
              b"\t\t// If we're exact or we got too small, bail.\n",
              b'\t\t// [AI-PATCH] metric sanity: accept requested size if metrics are unusable\n'
              b'\t\tif ( m_iHeight <= 0 || m_iHeight > m_iTall * 4 + 32 )\n'
              b'\t\t{\n'
              b'\t\t\tif ( nAIIter <= 3 ) AIFontDiag( "[AI-FONT-LOOP] BADMETRIC name=\'%s\' req=%d h=%d tall=%d -> use tall\\n", windowsFontName, m_iHeightRequested, m_iHeight, m_iTall );\n'
              b'\t\t\tm_iHeight = m_iTall;\n'
              b'\t\t\tm_iAscent = m_iTall;\n'
              b'\t\t\tif ( m_iMaxCharWidth <= 0 || m_iMaxCharWidth > m_iTall * 4 + 32 )\n'
              b'\t\t\t\tm_iMaxCharWidth = m_iTall;\n'
              b'\t\t\tbreak;\n'
              b'\t\t}\n',
              b'[AI-FONT-LOOP] BADMETRIC',
              "metric sanity clamp")

          # ============================================================
          # 5) BasePanel diag helper (must be before UpdateBackgroundState,
          #    so anchor on the function that precedes it)
          # ============================================================
          insert_before_first(
              PANEL,
              b'void CBasePanel::PaintBackground()\n{\n',
              b'#include <stdarg.h>\n'
              b'#include <stdlib.h>\n'
              b'// [AI-PATCH] diagnostics: direct file write + fflush (survives a hang)\n'
              b'static void AIDiag( const char *pFmt, ... )\n'
              b'{\n'
              b'\tstatic char s_szPath[512];\n'
              b'\tstatic bool s_bInit = false;\n'
              b'\tif ( !s_bInit )\n'
              b'\t{\n'
              b'\t\ts_bInit = true;\n'
              b'\t\tconst char *pHome = getenv( "VALVE_GAME_PATH" );\n'
              b'\t\tQ_snprintf( s_szPath, sizeof( s_szPath ), "%s/ai_diag.txt", pHome ? pHome : "/sdcard/srceng" );\n'
              b'\t}\n'
              b'\tFILE *pFile = fopen( s_szPath, "a" );\n'
              b'\tif ( !pFile )\n'
              b'\t\treturn;\n'
              b'\tva_list args;\n'
              b'\tva_start( args, pFmt );\n'
              b'\tvfprintf( pFile, pFmt, args );\n'
              b'\tva_end( args );\n'
              b'\tfflush( pFile );\n'
              b'\tfclose( pFile );\n'
              b'}\n'
              b'\n',
              b'[AI-PATCH] diagnostics: direct file write',
              "BasePanel diag helper")

          # ============================================================
          # 5b) THE REAL CULPRIT (found in BasePanel.cpp):
          #       CGameMenu::ApplySchemeSettings()
          #           int height = atoi(pScheme->GetResourceString("MainMenu.MenuItemHeight"));
          #           SetMenuItemHeight(height);
          #     and CBasePanel::ApplySchemeSettings()
          #           m_iGameMenuPos.x = atoi(pClientScheme->GetResourceString("Main.Menu.X"));
          #
          #     CSGO replaced the VGUI main menu with Panorama years ago, so
          #     those keys are gone from its scheme files.  atoi("") == 0 =>
          #     every menu item is 0 pixels tall, the menu sits at 0,0 and the
          #     menu itself is fully transparent => nothing is drawn at all.
          #     That is exactly the "background shows, zero text" screenshot.
          # ============================================================
          replace_all(
              PANEL,
              b'\t\tSetMenuItemHeight(height);',
              b'\t\tif ( height < 10 ) { height = IsProportional() ? scheme()->GetProportionalScaledValue( 34 ) : 34; }\n'
              b'\t\tSetMenuItemHeight(height);',
              "menu item height")

          insert_after_first(
              PANEL,
              b'\tm_iGameMenuPos.y = scheme()->GetProportionalScaledValue( m_iGameMenuPos.y );',
              b'\n'
              b'\t\t// [AI-PATCH-v8] no Main.Menu.X/Y in the CSGO scheme -> menu sat at 0,0\n'
              b'\t\t{\n'
              b'\t\t\tint nSW = 0, nSH = 0;\n'
              b'\t\t\tvgui::surface()->GetScreenSize( nSW, nSH );\n'
              b'\t\t\tif ( m_iGameMenuPos.x < nSW / 20 ) m_iGameMenuPos.x = nSW / 16;\n'
              b'\t\t\tif ( m_iGameMenuPos.y < nSH / 20 ) m_iGameMenuPos.y = nSH * 35 / 100;\n'
              b'\t\t}\n',
              b'[AI-PATCH-v8] no Main.Menu.X/Y',
              "menu position")

          # ============================================================
          # 5c) Last-resort labels: if every menu label localised to an empty
          #     string (no gameui_english.txt, or the .res we dropped on the
          #     phone was never read), add literal entries in code.
          # ============================================================
          insert_before_first(
              PANEL,
              b'\treturn menu;\n}',
              b'\t// [AI-PATCH-v8] hard-coded items fallback:\n'
              b'\t{\n'
              b'\t\tbool bAnyLabel = false;\n'
              b'\t\tfor ( int i = 0; i < menu->GetChildCount(); i++ )\n'
              b'\t\t{\n'
              b'\t\t\tvgui::MenuItem *pMI = dynamic_cast<vgui::MenuItem *>( menu->GetChild( i ) );\n'
              b'\t\t\tif ( pMI )\n'
              b'\t\t\t{\n'
              b'\t\t\t\twchar_t wszT[256];\n'
              b'\t\t\t\twszT[0] = 0;\n'
              b'\t\t\t\tpMI->GetText( wszT, sizeof( wszT ) );\n'
              b'\t\t\t\tif ( wszT[0] ) { bAnyLabel = true; break; }\n'
              b'\t\t\t}\n'
              b'\t\t}\n'
              b'\t\tif ( !bAnyLabel )\n'
              b'\t\t{\n'
              b'\t\t\tmenu->AddMenuItem( "AI_FindServers", "FIND SERVERS", "OpenServerBrowser", this );\n'
              b'\t\t\tmenu->AddMenuItem( "AI_CreateServer", "CREATE SERVER", "OpenCreateMultiplayerGameDialog", this );\n'
              b'\t\t\tmenu->AddMenuItem( "AI_Options", "OPTIONS", "OpenOptionsDialog", this );\n'
              b'\t\t\tmenu->AddMenuItem( "AI_Quit", "QUIT", "Quit", this );\n'
              b'\t\t\tAIDiag( "[AI-MENU] all labels empty -> added 4 hard-coded items\\n" );\n'
              b'\t\t}\n'
              b'\t\telse\n'
              b'\t\t{\n'
              b'\t\t\tAIDiag( "[AI-MENU] labels loaded OK, children=%d\\n", menu->GetChildCount() );\n'
              b'\t\t}\n'
              b'\t}\n',
              b'[AI-PATCH-v8] hard-coded items fallback',
              "hard-coded menu items")

          # ============================================================
          # 6) Startup banner + 1 Hz state snapshot + main-menu force
          #    (at the top of CBasePanel::UpdateBackgroundState, called every
          #     frame from CBasePanel::RunFrame)
          # ============================================================
          insert_after_first(
              PANEL,
              b'void CBasePanel::UpdateBackgroundState()\n{\n',
              b'\t// [AI-PATCH] startup banner + 1Hz state snapshot\n'
              b'\t{\n'
              b'\t\tstatic bool s_bBanner = false;\n'
              b'\t\tif ( !s_bBanner )\n'
              b'\t\t{\n'
              b'\t\t\ts_bBanner = true;\n'
              b'\t\t\tAIDiag( "[AI-PATCH-v8] engine patches ACTIVE (font + transition + menu force + menu metrics + direct text)\\n" );\n'
              b'\t\t\tMsg( "[AI-PATCH-v8] engine patches ACTIVE\\n" );\n'
              b'\t\t}\n'
              b'\t\tstatic float s_flNext = 0.0f;\n'
              b'\t\tstatic int s_nCount = 0;\n'
              b'\t\tfloat fNow = engine->Time();\n'
              b'\t\tif ( fNow >= s_flNext )\n'
              b'\t\t{\n'
              b'\t\t\ts_flNext = fNow + 1.0f;\n'
              b'\t\t\tif ( s_nCount < 120 )\n'
              b'\t\t\t{\n'
              b'\t\t\t\ts_nCount++;\n'
              b'\t\t\t\tconst char *pLvl = engine->GetLevelName();\n'
              b'\t\t\t\tAIDiag( "[AI-DIAG] #%d t=%.2f state=%d load=%d trans=%d menuA=%d dlg=%d inLvl=%d inBg=%d ever=%d plat=%d lvl=\'%s\'\\n",\n'
              b'\t\t\t\t\ts_nCount, fNow, (int)m_eBackgroundState, (int)m_bLevelLoading, (int)m_bRenderingBackgroundTransition,\n'
              b'\t\t\t\t\tm_pGameMenu ? m_pGameMenu->GetAlpha() : -1, g_hLoadingDialog.Get() ? 1 : 0,\n'
              b'\t\t\t\t\tGameUI().IsInLevel() ? 1 : 0, GameUI().IsInBackgroundLevel() ? 1 : 0,\n'
              b'\t\t\t\t\tm_bEverActivated ? 1 : 0, m_bPlatformMenuInitialized ? 1 : 0, pLvl ? pLvl : "" );\n'
              b'\t\t\t}\n'
              b'\t\t}\n'
              b'\t}\n'
              b'\t// [AI-PATCH] main menu visibility guarantee: no level name => not in a level\n'
              b'\t{\n'
              b'\t\tconst char *pLvl2 = engine->GetLevelName();\n'
              b'\t\tif ( !pLvl2 || !pLvl2[0] )\n'
              b'\t\t{\n'
              b'\t\t\tif ( m_bLevelLoading )\n'
              b'\t\t\t{\n'
              b'\t\t\t\tAIDiag( "[AI-PATCH] stale loading state cleared (dlg=%d)\\n", g_hLoadingDialog.Get() ? 1 : 0 );\n'
              b'\t\t\t\tm_bLevelLoading = false;\n'
              b'\t\t\t\tif ( g_hLoadingDialog.Get() )\n'
              b'\t\t\t\t{\n'
              b'\t\t\t\t\tg_hLoadingDialog->Close();\n'
              b'\t\t\t\t\tg_hLoadingDialog = NULL;\n'
              b'\t\t\t\t}\n'
              b'\t\t\t}\n'
              b'\t\t\tif ( !m_ExitingFrameCount && !g_hLoadingDialog.Get() && !GameUI().IsInLevel()\n'
              b'\t\t\t\t&& !GameUI().IsInBackgroundLevel() && m_eBackgroundState != BACKGROUND_DISCONNECTED )\n'
              b'\t\t\t{\n'
              b'\t\t\t\tAIDiag( "[AI-PATCH] force BACKGROUND_DISCONNECTED (was state=%d)\\n", (int)m_eBackgroundState );\n'
              b'\t\t\t\tSetBackgroundRenderState( BACKGROUND_DISCONNECTED );\n'
              b'\t\t\t}\n'
              b'\t\t}\n'
              b'\t}\n',
              b'[AI-PATCH] startup banner',
              "banner + state snapshot + menu force")

          # ============================================================
          # 6b) Every frame: force the menu visible / opaque / legible.
          #     Plus a one-shot deep dump (label text, font handle, font tall,
          #     fg colour, item rect) at t>15s.
          # ============================================================
          insert_before_first(
              PANEL,
              b'\t// [AI-PATCH] main menu visibility guarantee: no level name => not in a level\n',
              b'\t// [AI-PATCH-v8] force menu visible / opaque / legible (every frame)\n'
              b'\t{\n'
              b'\t\tif ( m_pGameMenu )\n'
              b'\t\t{\n'
              b'\t\t\tif ( m_pGameMenu->GetAlpha() < 250 ) m_pGameMenu->SetAlpha( 255 );\n'
              b'\t\t\tif ( !m_pGameMenu->IsVisible() ) m_pGameMenu->SetVisible( true );\n'
              b'\t\t\t// [AI-PATCH-v8.2] absolute pixels only -- scheme proportional base is 0 on this build\n'
              b'\t\t\t{\n'
              b'\t\t\t\tint nSWM = 0, nSHM = 0;\n'
              b'\t\t\t\tsurface()->GetScreenSize( nSWM, nSHM );\n'
              b'\t\t\t\tif ( m_iGameMenuPos.x < 10 ) m_iGameMenuPos.x = nSWM / 16;\n'
              b'\t\t\t\tif ( m_iGameMenuPos.y < 10 ) m_iGameMenuPos.y = nSHM * 35 / 100;\n'
              b'\t\t\t\tint nIH = m_pGameMenu->GetMenuItemHeight();\n'
              b'\t\t\t\tif ( nIH < 10 )\n'
              b'\t\t\t\t{\n'
              b'\t\t\t\t\tint nForceH = nSHM / 28;\n'
              b'\t\t\t\t\tif ( nForceH < 34 ) nForceH = 34;\n'
              b'\t\t\t\t\tm_pGameMenu->SetMenuItemHeight( nForceH );\n'
              b'\t\t\t\t\tm_pGameMenu->InvalidateLayout( true, false );  // do NOT reload scheme: it would reset the height to 0\n'
              b'\t\t\t\t\tAIDiag( "[AI-MENU] forced item height %d -> %d (screen %dx%d)\\n", nIH, nForceH, nSWM, nSHM );\n'
              b'\t\t\t\t}\n'
              b'\t\t\t}\n'
              b'\t\t\tstatic vgui::HFont s_hMenuFont = 0;\n'
              b'\t\t\tif ( !s_hMenuFont )\n'
              b'\t\t\t{\n'
              b'\t\t\t\tvgui::ISurface *pSM = surface();\n'
              b'\t\t\t\tvgui::IScheme *pSchM = vgui::scheme()->GetIScheme( vgui::scheme()->GetScheme( "ClientScheme" ) );\n'
              b'\t\t\t\tif ( !pSchM ) pSchM = vgui::scheme()->GetIScheme( vgui::scheme()->GetScheme( "SourceScheme" ) );\n'
              b'\t\t\t\tif ( pSchM )\n'
              b'\t\t\t\t{\n'
              b'\t\t\t\t\tvgui::HFont hTryM = pSchM->GetFont( "Default", true );\n'
              b'\t\t\t\t\tif ( hTryM && pSM->GetFontTall( hTryM ) > 0 ) s_hMenuFont = hTryM;\n'
              b'\t\t\t\t}\n'
              b'\t\t\t\tif ( !s_hMenuFont )\n'
              b'\t\t\t\t{\n'
              b'\t\t\t\t\ts_hMenuFont = pSM->CreateFont();\n'
              b'\t\t\t\t\tpSM->SetFontGlyphSet( s_hMenuFont, "DejaVu Sans", 30, 500, 0, 0, 0x010 );\n'
              b'\t\t\t\t}\n'
              b'\t\t\t\tAIDiag( "[AI-MENU] menu font handle=%d tall=%d\\n", (int)s_hMenuFont, (int)pSM->GetFontTall( s_hMenuFont ) );\n'
              b'\t\t\t}\n'
              b'\t\t\tint nIt = m_pGameMenu->GetChildCount();\n'
              b'\t\t\tfor ( int i = 0; i < nIt; i++ )\n'
              b'\t\t\t{\n'
              b'\t\t\t\tvgui::Panel *pIt = m_pGameMenu->GetChild( i );\n'
              b'\t\t\t\tif ( !pIt ) continue;\n'
              b'\t\t\t\tif ( !pIt->IsVisible() ) pIt->SetVisible( true );\n'
              b'\t\t\t\tif ( pIt->GetAlpha() < 250 ) pIt->SetAlpha( 255 );\n'
              b'\t\t\t\tpIt->SetFgColor( Color( 255, 255, 0, 255 ) );\n'
              b'\t\t\t\tpIt->SetBgColor( Color( 0, 0, 0, 130 ) );\n'
              b'\t\t\t\tpIt->SetPaintBackgroundEnabled( true );\n'
              b'\t\t\t\tvgui::MenuItem *pMIM = dynamic_cast<vgui::MenuItem *>( pIt );\n'
              b'\t\t\t\tif ( pMIM && s_hMenuFont && pMIM->GetFont() != s_hMenuFont ) pMIM->SetFont( s_hMenuFont );\n'
              b'\t\t\t}\n'
              b'\t\t}\n'
              b'\t}\n'
              b'\t// [AI-PATCH-v8] one-shot deep menu dump\n'
              b'\t{\n'
              b'\t\tstatic bool s_bMenuDumped = false;\n'
              b'\t\tif ( !s_bMenuDumped && m_pGameMenu && engine->Time() > 20.0f\n'
              b'\t\t\t&& ( m_pGameMenu->GetTall() > 0 || engine->Time() > 40.0f ) )\n'
              b'\t\t{\n'
              b'\t\t\ts_bMenuDumped = true;\n'
              b'\t\t\tint mw = 0, mh = 0, mx = 0, my = 0;\n'
              b'\t\t\tm_pGameMenu->GetSize( mw, mh );\n'
              b'\t\t\tm_pGameMenu->GetPos( mx, my );\n'
              b'\t\t\tint nCC = m_pGameMenu->GetChildCount();\n'
              b'\t\t\tint sw = 0, sh = 0;\n'
              b'\t\t\tvgui::surface()->GetScreenSize( sw, sh );\n'
              b'\t\t\tAIDiag( "[AI-MENU] screen=%dx%d menu vis=%d alpha=%d pos=%d,%d size=%dx%d children=%d\\n",\n'
              b'\t\t\t\tsw, sh, m_pGameMenu->IsVisible() ? 1 : 0, m_pGameMenu->GetAlpha(), mx, my, mw, mh, nCC );\n'
              b'\t\t\tfor ( int i = 0; i < nCC && i < 14; i++ )\n'
              b'\t\t\t{\n'
              b'\t\t\t\tvgui::Panel *pIt = m_pGameMenu->GetChild( i );\n'
              b'\t\t\t\tif ( !pIt ) { AIDiag( "[AI-MENU] item %d = NULL\\n", i ); continue; }\n'
              b'\t\t\t\tint iw = 0, ih = 0, ix = 0, iy = 0;\n'
              b'\t\t\t\tpIt->GetSize( iw, ih );\n'
              b'\t\t\t\tpIt->GetPos( ix, iy );\n'
              b'\t\t\t\tvgui::MenuItem *pMI = dynamic_cast<vgui::MenuItem *>( pIt );\n'
              b'\t\t\t\twchar_t wszItem[256];\n'
              b'\t\t\t\twszItem[0] = 0;\n'
              b'\t\t\t\tif ( pMI ) pMI->GetText( wszItem, sizeof( wszItem ) );\n'
              b'\t\t\t\tchar szT[96];\n'
              b'\t\t\t\tint k = 0;\n'
              b'\t\t\t\twhile ( wszItem[k] && k < 90 ) { szT[k] = ( wszItem[k] < 128 ) ? (char)wszItem[k] : \'?\'; k++; }\n'
              b'\t\t\t\tszT[k] = 0;\n'
              b'\t\t\t\tvgui::HFont hF = pMI ? pMI->GetFont() : 0;\n'
              b'\t\t\t\tint iFT = ( (int)hF > 0 ) ? (int)vgui::surface()->GetFontTall( hF ) : -1;\n'
              b'\t\t\t\tColor cFg = pIt->GetFgColor();\n'
              b'\t\t\t\tAIDiag( "[AI-MENU] item %d vis=%d alpha=%d pos=%d,%d size=%dx%d cls=%s font=%d ftall=%d fg=%d,%d,%d,%d text=\'%s\'\\n",\n'
              b'\t\t\t\t\ti, pIt->IsVisible() ? 1 : 0, pIt->GetAlpha(), ix, iy, iw, ih, pIt->GetClassName(),\n'
              b'\t\t\t\t\t(int)hF, iFT,\n'
              b'\t\t\t\t\t(int)cFg.r(), (int)cFg.g(), (int)cFg.b(), (int)cFg.a(), szT );\n'
              b'\t\t\t}\n'
              b'\t\t}\n'
              b'\t}\n',
              b'[AI-PATCH-v8] one-shot deep menu dump',
              "menu force + deep dump")

          # ============================================================
          # 6d) Paint straight to the surface, bypassing vgui menu + scheme.
          #     Two jobs:
          #       1) "AI-TEXT-OK w x h ftall=NN" proves the glyph pipeline.
          #       2) repaint every menu label ourselves, so even if the vgui
          #          MenuItem path is broken the user still sees the entries.
          # ============================================================
          insert_after_first(
              PANEL,
              b'\t\tDrawBackgroundImage();\n',
              b'\n'
              b'\t\t// [AI-PATCH-v8] direct surface text + menu label fallback\n'
              b'\t\t{\n'
              b'\t\t\tvgui::ISurface *pS = surface();\n'
              b'\t\t\tstatic vgui::HFont s_hAIFont = 0;\n'
              b'\t\t\tif ( !s_hAIFont )\n'
              b'\t\t\t{\n'
              b'\t\t\t\tvgui::IScheme *pSch = vgui::scheme()->GetIScheme( vgui::scheme()->GetScheme( "ClientScheme" ) );\n'
              b'\t\t\t\tif ( !pSch ) pSch = vgui::scheme()->GetIScheme( vgui::scheme()->GetScheme( "SourceScheme" ) );\n'
              b'\t\t\t\tif ( pSch )\n'
              b'\t\t\t\t{\n'
              b'\t\t\t\t\tvgui::HFont hTry = pSch->GetFont( "Default", true );\n'
              b'\t\t\t\t\tif ( hTry && pS->GetFontTall( hTry ) > 0 ) s_hAIFont = hTry;\n'
              b'\t\t\t\t}\n'
              b'\t\t\t\tif ( !s_hAIFont )\n'
              b'\t\t\t\t{\n'
              b'\t\t\t\t\ts_hAIFont = pS->CreateFont();\n'
              b'\t\t\t\t\tpS->SetFontGlyphSet( s_hAIFont, "DejaVu Sans", 26, 500, 0, 0, 0x010 );\n'
              b'\t\t\t\t}\n'
              b'\t\t\t}\n'
              b'\t\t\tint nSW = 0, nSH = 0;\n'
              b'\t\t\tpS->GetScreenSize( nSW, nSH );\n'
              b'\t\t\tchar szAI[96];\n'
              b'\t\t\tQ_snprintf( szAI, sizeof( szAI ), "AI-TEXT-OK %dx%d ftall=%d", nSW, nSH, (int)pS->GetFontTall( s_hAIFont ) );\n'
              b'\t\t\twchar_t wszAI[96];\n'
              b'\t\t\tint nLen = 0;\n'
              b'\t\t\twhile ( szAI[nLen] && nLen < 95 ) { wszAI[nLen] = (wchar_t)(unsigned char)szAI[nLen]; nLen++; }\n'
              b'\t\t\twszAI[nLen] = 0;\n'
              b'\t\t\tpS->DrawSetTextFont( s_hAIFont );\n'
              b'\t\t\tpS->DrawSetTextColor( 0, 255, 0, 255 );\n'
              b'\t\t\tpS->DrawSetTextPos( 24, 24 );\n'
              b'\t\t\tpS->DrawPrintText( wszAI, nLen );\n'
              b'\t\t\tif ( m_pGameMenu )\n'
              b'\t\t\t{\n'
              b'\t\t\t\tint nIt2 = m_pGameMenu->GetChildCount();\n'
              b'\t\t\t\tbool bBroken = ( m_pGameMenu->GetTall() < 10 );\n'
              b'\t\t\t\tint nRowY = nSH * 30 / 100;\n'
              b'\t\t\t\tint nRowH = nSH / 22;\n'
              b'\t\t\t\tfor ( int i2 = 0; i2 < nIt2; i2++ )\n'
              b'\t\t\t\t{\n'
              b'\t\t\t\t\tvgui::Panel *pIt2 = m_pGameMenu->GetChild( i2 );\n'
              b'\t\t\t\t\tif ( !pIt2 ) continue;\n'
              b'\t\t\t\t\tvgui::MenuItem *pMI2 = dynamic_cast<vgui::MenuItem *>( pIt2 );\n'
              b'\t\t\t\t\tif ( !pMI2 ) continue;\n'
              b'\t\t\t\t\twchar_t wszIt[256];\n'
              b'\t\t\t\t\twszIt[0] = 0;\n'
              b'\t\t\t\t\tpMI2->GetText( wszIt, sizeof( wszIt ) );\n'
              b'\t\t\t\t\tif ( !wszIt[0] ) continue;\n'
              b'\t\t\t\t\tint ix2 = 0, iy2 = 0;\n'
              b'\t\t\t\t\tif ( bBroken )\n'
              b'\t\t\t\t\t{\n'
              b'\t\t\t\t\t\tix2 = nSW / 8;\n'
              b'\t\t\t\t\t\tiy2 = nRowY;\n'
              b'\t\t\t\t\t\tnRowY += nRowH;\n'
              b'\t\t\t\t\t}\n'
              b'\t\t\t\t\telse\n'
              b'\t\t\t\t\t{\n'
              b'\t\t\t\t\t\tpIt2->GetPos( ix2, iy2 );\n'
              b'\t\t\t\t\t\tvgui::Panel *pPar2 = pIt2->GetParent();\n'
              b'\t\t\t\t\t\twhile ( pPar2 && pPar2 != this ) { int px2 = 0, py2 = 0; pPar2->GetPos( px2, py2 ); ix2 += px2; iy2 += py2; pPar2 = pPar2->GetParent(); }\n'
              b'\t\t\t\t\t}\n'
              b'\t\t\t\t\tpS->DrawSetTextFont( s_hAIFont );\n'
              b'\t\t\t\t\tpS->DrawSetTextColor( 255, 255, 0, 255 );\n'
              b'\t\t\t\t\tpS->DrawSetTextPos( ix2 + 20, iy2 + 4 );\n'
              b'\t\t\t\t\tpS->DrawPrintText( wszIt, (int)wcslen( wszIt ) );\n'
              b'\t\t\t\t}\n'
              b'\t\t\t}\n'
              b'\t\t}\n',
              b'[AI-PATCH-v8] direct surface text',
              "direct surface text")

          # ============================================================
          # 7) Background transition: clear flag + restore alpha after 3s
          # ============================================================
          insert_after_first(
              PANEL,
              b'alpha = clamp( alpha, 0, 255 );',
              b' if ( m_bRenderingBackgroundTransition && frametime >= m_flTransitionEndTime ) { m_bRenderingBackgroundTransition = false; alpha = 255; }',
              b'm_bRenderingBackgroundTransition = false; alpha = 255;',
              "menu transition")

          # ============================================================
          # 8) Only hide the menu / draw the loading plate while really loading
          # ============================================================
          replace_all(PANEL,
                      b'\t\tSetMenuAlpha( 0 );',
                      b'\t\tSetMenuAlpha( g_hLoadingDialog.Get() ? 0 : 255 );',
                      "hide menu only while loading")
          replace_all(PANEL,
                      b'm_bRenderingBackgroundTransition || m_eBackgroundState == BACKGROUND_LOADING',
                      b'm_bRenderingBackgroundTransition || ( m_eBackgroundState == BACKGROUND_LOADING && g_hLoadingDialog.Get() )',
                      "loading plate only while loading")
          PY
          echo "=== 补丁校验 ==="
          grep -c 'getenv("VALVE_GAME_PATH")' vgui2/vgui_surfacelib/linuxfont.cpp
          grep -q 'static void AIFontDiag' vgui2/vgui_surfacelib/linuxfont.cpp || (echo '!! 字体诊断未插入' && exit 1)
          grep -q 'AI-FONT-LOOP] ABORT' vgui2/vgui_surfacelib/linuxfont.cpp || (echo '!! 字体循环保护未插入' && exit 1)
          grep -q 'AI-FONT-LOOP] BADMETRIC' vgui2/vgui_surfacelib/linuxfont.cpp || (echo '!! 度量保护未插入' && exit 1)
          grep -q 'static void AIDiag' gameui/BasePanel.cpp || (echo '!! 诊断工具未插入' && exit 1)
          grep -q 'AI-PATCH-v8' gameui/BasePanel.cpp || (echo '!! 构建横幅未插入' && exit 1)
          grep -q 'stale loading state cleared' gameui/BasePanel.cpp || (echo '!! 主菜单强制补丁未插入' && exit 1)
          grep -q 'height < 10' gameui/BasePanel.cpp || (echo '!! 菜单行高修正未插入' && exit 1)
          grep -q 'no Main.Menu.X/Y' gameui/BasePanel.cpp || (echo '!! 菜单位置修正未插入' && exit 1)
          grep -q 'AI-TEXT-OK' gameui/BasePanel.cpp || (echo '!! 文字直绘未插入' && exit 1)
          grep -q 'hard-coded items fallback' gameui/BasePanel.cpp || (echo '!! 菜单兜底项未插入' && exit 1)
          grep -q 'AI-MENU] screen=' gameui/BasePanel.cpp || (echo '!! 菜单深度转储未插入' && exit 1)
          grep -q 'm_bRenderingBackgroundTransition = false; alpha = 255;' gameui/BasePanel.cpp || (echo '!! 转场补丁未生效' && exit 1)
          echo "补丁校验通过"
          wget -q https://dl.google.com/android/repository/android-ndk-r10e-linux-x86_64.zip
          unzip -q android-ndk-r10e-linux-x86_64.zip
          export ANDROID_NDK_HOME=$PWD/android-ndk-r10e/
          export NDK_HOME=$PWD/android-ndk-r10e/
          # ── 改用 release 构建（关键）──────────────────────────────────────────
          # 之前一直用 -T debug：引擎以 -O0 编译，无优化。手机上跑 2408x1080 的 Source
          # 引擎会慢到几秒一帧 → 画面像卡住、loading 图标常亮。
          # 官方发行脚本 nillerusr/just-old-shit/deploy.sh 用的就是 -T release。
          ./waf configure -T release --android=armeabi-v7a-hard,4.9,21 --togles --disable-warns
          ./waf build

      - name: Collect native libs
        run: |
          mkdir -p libs/armeabi-v7a
          find source-engine/build -name "*.so" -exec cp -v {} libs/armeabi-v7a/ \; || true
          find source-engine/lib/android/arm -name "*.so" -exec cp -v {} libs/armeabi-v7a/ \; || true
          ls -la libs/armeabi-v7a/ | head -40

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (manual install into $HOME)
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d android-sdk/
          mv android-sdk/cmdline-tools android-sdk/cmdline-tools-tmp
          mkdir -p android-sdk/cmdline-tools/latest
          mv android-sdk/cmdline-tools-tmp/bin android-sdk/cmdline-tools-tmp/lib android-sdk/cmdline-tools-tmp/NOTICE.txt android-sdk/cmdline-tools-tmp/source.properties android-sdk/cmdline-tools/latest/
          yes | android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk --licenses > /dev/null 2>&1 || true
          android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: srceng-debug-apk
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 验证 APK 内容：壳自带的 extras_dir.vpk 是引擎挂载"自定义菜单资产"（社交图标、字体）用的，
      # 少了它引擎日志会报 Missing Vgui material vgui/discord_logo 等。这里打印出来，避免盲修。
      - name: Inspect APK contents (assets / native libs)
        run: |
          APK=$(ls build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          echo "--- assets/ ---"
          unzip -l "$APK" | grep -E "assets/" || echo "!! 没有任何 assets 文件"
          echo "--- extras_dir.vpk 是否存在 ---"
          unzip -l "$APK" | grep -i "extras_dir.vpk" || echo "!! extras_dir.vpk 不在 APK 里（引擎会缺字体和自定义菜单图标）"
          echo "--- 原生库数量与体积 ---"
          unzip -l "$APK" | grep -c "lib/armeabi-v7a/" || true
          unzip -l "$APK" | grep -E "libSDL2|libengine|libclient|liblauncher" || true
